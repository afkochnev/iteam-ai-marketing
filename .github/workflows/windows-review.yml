name: Windows review checks

on:
  pull_request:
    paths:
      - ".github/workflows/windows-review.yml"
      - "scripts/windows_review/**"
      - "scripts/tests/test_windows_review*.py"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -B -m unittest discover -s scripts/tests -p "test_windows_review*.py" -v
