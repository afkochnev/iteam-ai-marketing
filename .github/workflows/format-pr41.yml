name: Format PR41 Python files

on:
  push:
    branches:
      - feat/vk-refreshable-publishing

permissions:
  contents: write

concurrency:
  group: format-pr41
  cancel-in-progress: false

jobs:
  format:
    if: github.event.head_commit.message == 'Stage PR41 Ruff formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vk-refreshable-publishing
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Format exact changed Python files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.12.10
          ruff format \
            backend/app/integrations/telegram.py \
            backend/app/integrations/vk_credentials.py \
            backend/app/maintenance/vk_publishing_credentials.py \
            backend/app/tests/test_publications.py \
            backend/app/tests/test_vk_credentials.py \
            backend/app/tests/test_worker_config.py
          ruff check \
            backend/app/integrations/telegram.py \
            backend/app/integrations/vk_credentials.py \
            backend/app/maintenance/vk_publishing_credentials.py \
            backend/app/tests/test_publications.py \
            backend/app/tests/test_vk_credentials.py \
            backend/app/tests/test_worker_config.py
          git rm .github/workflows/format-pr41.yml

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Alexander'
          git config user.email 'afkochnev@gmail.com'
          git add backend/app/integrations/telegram.py \
            backend/app/integrations/vk_credentials.py \
            backend/app/maintenance/vk_publishing_credentials.py \
            backend/app/tests/test_publications.py \
            backend/app/tests/test_vk_credentials.py \
            backend/app/tests/test_worker_config.py
          git commit -m 'Format PR41 Python changes'
          git push origin HEAD:feat/vk-refreshable-publishing
