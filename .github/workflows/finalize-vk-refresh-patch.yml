name: Finalize VK refresh security patch

on:
  push:
    branches:
      - fix/vk-refreshable-publishing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vk-refreshable-publishing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final security review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1))

          script = "scripts/vk_user_token_preflight.py"
          replace_once(
              script,
              "class PreflightError(RuntimeError):\n    pass\n\n\ndef hidden",
              "class PreflightError(RuntimeError):\n    pass\n\n\ndef safe_vk_error(payload: dict[str, Any]) -> str:\n    error = payload.get(\"error\", \"UNKNOWN_ERROR\")\n    if isinstance(error, dict):\n        code = error.get(\"error_code\", \"UNKNOWN_ERROR\")\n        message = error.get(\"error_msg\", \"VK API error\")\n        return f\"{code}: {message}\"\n    description = payload.get(\"error_description\", \"\")\n    return f\"{error} {description}\".strip()\n\n\ndef hidden",
          )
          replace_once(
              script,
              "    except urllib.error.HTTPError as exc:\n        try:\n            payload = json.loads(exc.read())\n            error = payload.get(\"error\", \"HTTP_ERROR\")\n            description = payload.get(\"error_description\", \"\")\n        except (ValueError, AttributeError):\n            error, description = \"HTTP_ERROR\", \"\"\n        raise PreflightError(\n            f\"VK ID отклонил запрос: {error} {description}\".strip()\n        ) from exc\n",
              "    except urllib.error.HTTPError as exc:\n        try:\n            payload = json.loads(exc.read())\n            message = safe_vk_error(payload) if isinstance(payload, dict) else \"HTTP_ERROR\"\n        except (ValueError, AttributeError):\n            message = \"HTTP_ERROR\"\n        raise PreflightError(f\"VK отклонил запрос: {message}\") from exc\n",
          )
          replace_once(
              script,
              "    if \"error\" in payload:\n        raise PreflightError(\n            f\"VK отклонил запрос: {payload.get('error')} \"\n            f\"{payload.get('error_description', '')}\".strip()\n        )\n    return payload\n",
              "    return payload\n",
          )
          replace_once(
              script,
              "    if str(payload.get(\"state\")) != state:\n        raise PreflightError(\"VK ID вернул другой state при обмене кода.\")\n",
              "    if \"error\" in payload:\n        raise PreflightError(f\"VK ID отклонил код: {safe_vk_error(payload)}\")\n    if str(payload.get(\"state\")) != state:\n        raise PreflightError(\"VK ID вернул другой state при обмене кода.\")\n",
          )
          replace_once(
              script,
              "    if str(payload.get(\"state\")) != state:\n        raise PreflightError(\"VK ID вернул другой state при обновлении токена.\")\n",
              "    if \"error\" in payload:\n        raise PreflightError(f\"VK ID отклонил refresh token: {safe_vk_error(payload)}\")\n    if str(payload.get(\"state\")) != state:\n        raise PreflightError(\"VK ID вернул другой state при обновлении токена.\")\n",
          )
          replace_once(
              script,
              "mode = stat.S_IMODE(path.stat().st_mode)\nif mode != 0o600 or os.geteuid() != 10001:\n",
              "metadata = path.stat()\nmode = stat.S_IMODE(metadata.st_mode)\nif mode != 0o600 or metadata.st_uid != 10001 or os.geteuid() != 10001:\n",
          )

          tests = "backend/app/tests/test_worker_config.py"
          replace_once(
              tests,
              '    "TEGRAM_METRICS_API_HASH": "private-metrics-secret",\n',
              '    "TELEGRAM_METRICS_API_HASH": "private-metrics-secret",\n',
          )
          replace_once(
              tests,
              '# Correct the key while keeping the dictionary declaration visually grouped.\nMETRICS_FIELDS["TELEGRAM_METRICS_API_HASH"] = METRICS_FIELDS.pop(\n    "TEGRAM_METRICS_API_HASH"\n)\n\n\n',
              "",
          )
          PY
      - name: Format and validate
        run: |
          pip install ruff==0.12.10
          ruff check --fix backend/app/core/config.py backend/app/integrations/vk_credentials.py backend/app/tests/test_vk_credentials.py backend/app/tests/test_worker_config.py scripts/vk_user_token_preflight.py
          ruff format backend/app/core/config.py backend/app/integrations/vk_credentials.py backend/app/tests/test_vk_credentials.py backend/app/tests/test_worker_config.py scripts/vk_user_token_preflight.py
          python -m py_compile backend/app/integrations/vk_credentials.py scripts/vk_user_token_preflight.py
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/finalize-vk-refresh-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize refreshable VK credential safeguards"
          git push origin HEAD:fix/vk-refreshable-publishing
