name: Fix PR40 archived-state async test

"on":
  push:
    branches:
      - "fix/publication-workspace-followups"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publication-workspace-followups
          fetch-depth: 0
      - name: Wait for the asynchronously loaded archived card
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/tests/publications.test.tsx")
          text = path.read_text()
          old = '    expect(within(section).getByRole("alert")).toHaveTextContent("можно только отменить");'
          new = '    expect(await within(section).findByRole("alert")).toHaveTextContent("можно только отменить");'
          if text.count(old) != 1:
              raise SystemExit(f"expected one archived alert assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/fix-pr40-archived-test-wait.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wait for archived publication state in PR40 test"
          git push origin HEAD:fix/publication-workspace-followups
