name: Fix PR39 regression tests

on:
  push:
    branches:
      - fix/overdue-plan-content-decisions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/overdue-plan-content-decisions
          fetch-depth: 0

      - name: Fix test fixtures and structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}; found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          content_path = "frontend/tests/content.test.tsx"
          replace_once(
              content_path,
              '    const postVersion = "post-version-1";\n',
              '    const postVersion = "post-version-1";\n    const plannedAt = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();\n',
          )
          replace_once(
              content_path,
              'scheduled_at: "2026-10-03T10:00:00Z"',
              'scheduled_at: plannedAt',
          )
          replace_once(
              content_path,
              'scheduled_at: "2026-10-03T10:00:00Z"',
              'scheduled_at: plannedAt',
          )

          publications_path = "frontend/tests/publications.test.tsx"
          replace_once(
              publications_path,
              '  it("offers explicit publish-now only when the provider is enabled", async () => {\n  it("reschedules an overdue approved plan slot before a Publication exists", async () => {\n',
              '  it("reschedules an overdue approved plan slot before a Publication exists", async () => {\n',
          )
          replace_once(
              publications_path,
              '  });\n\n    mocks.content.mockResolvedValue([{ id: "post-1", title: "Просроченный пост" }]);\n',
              '  });\n\n  it("offers explicit publish-now only when the provider is enabled", async () => {\n    mocks.content.mockResolvedValue([{ id: "post-1", title: "Просроченный пост" }]);\n',
          )
          PY
          rm -f .github/workflows/fix-pr39-tests.yml

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes produced" >&2; exit 1; }
          git commit -m "Fix PR39 regression test structure"
          git push origin HEAD:fix/overdue-plan-content-decisions
