name: Approve migration release
on:
  workflow_dispatch:
    inputs:
      rehearsal_run_id:
        description: Successful first-attempt CI run on main containing the migration rehearsal
        required: true
        type: string
      rehearsal_artifact_id:
        description: Exact migration-drill-proof artifact ID from that CI run
        required: true
        type: string
      proof_sha256:
        description: 'Raw proof JSON SHA-256, formatted as sha256:<64 lowercase hex characters>'
        required: true
        type: string
      expected_current_release_sha:
        description: Exact expected production BUILD_SHA; must match the rehearsed source
        required: true
        type: string
      expected_current_schema_head:
        description: Exact expected production schema; must match the rehearsed source
        required: true
        type: string
      target_build_run_id:
        description: Exact successful Release images run bound by the rehearsal
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: production-release-approval
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      review_artifact_id: ${{ steps.review_artifact.outputs.artifact-id }}
      review_sha256: ${{ steps.review_hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the migration and publish the review summary
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_RUN: ${{ inputs.rehearsal_run_id }}
          REHEARSAL_ARTIFACT: ${{ inputs.rehearsal_artifact_id }}
          PROOF_SHA256: ${{ inputs.proof_sha256 }}
          EXPECTED_SOURCE: ${{ inputs.expected_current_release_sha }}
          EXPECTED_SCHEMA: ${{ inputs.expected_current_schema_head }}
          TARGET_BUILD: ${{ inputs.target_build_run_id }}
        run: |
          python3 scripts/migration_release_approval.py prepare \
            --rehearsal-run "$REHEARSAL_RUN" \
            --rehearsal-artifact "$REHEARSAL_ARTIFACT" \
            --proof-sha256 "$PROOF_SHA256" \
            --expected-source-release "$EXPECTED_SOURCE" \
            --expected-source-schema "$EXPECTED_SCHEMA" \
            --target-build-run "$TARGET_BUILD" \
            --output migration-review.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Bind the exact review bytes
        id: review_hash
        run: |
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          digest = hashlib.sha256(Path('migration-review.json').read_bytes()).hexdigest()
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write('sha256=sha256:' + digest + '\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: review_artifact
        with:
          name: migration-release-for-review
          path: migration-review.json
          if-no-files-found: error
  approve:
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.prepare.outputs.review_artifact_id }}
          path: ${{ runner.temp }}/migration-release-review
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reverify and sign the exact reviewed migration
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_SHA256: ${{ needs.prepare.outputs.review_sha256 }}
        run: |
          python3 scripts/migration_release_approval.py seal \
            --review "$RUNNER_TEMP/migration-release-review/migration-review.json" \
            --review-sha256 "$REVIEW_SHA256" \
            --output migration-release.json
          cosign sign-blob --yes --bundle migration-release.sigstore.json migration-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-migration-release
          path: |
            migration-release.json
            migration-release.sigstore.json
          if-no-files-found: error
