name: Apply VK refresh runtime isolation patch

on:
  push:
    branches:
      - fix/vk-refreshable-publishing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vk-refreshable-publishing
          fetch-depth: 0
      - name: Patch configuration and Compose isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "backend/app/core/config.py",
              "from functools import lru_cache\n\nfrom pydantic",
              "from functools import lru_cache\nfrom pathlib import Path\nfrom urllib.parse import urlparse\n\nfrom pydantic",
          )
          replace_once(
              "backend/app/core/config.py",
              "    vk_access_token: str | None = None\n    vk_owner_id: int | None = None\n    vk_api_version: str = \"5.199\"\n    vk_request_timeout_seconds: int = 30\n",
              "    vk_access_token: str | None = None\n    vk_credentials_file: str | None = None\n    vk_owner_id: int | None = None\n    vk_api_version: str = \"5.199\"\n    vk_request_timeout_seconds: int = 30\n    vk_id_token_endpoint: str = \"https://id.vk.ru/oauth2/auth\"\n    vk_refresh_skew_seconds: int = Field(default=120, ge=30, le=1800)\n",
          )
          replace_once(
              "backend/app/core/config.py",
              "    @field_validator(\"worker_role\", \"scheduler_role\", mode=\"before\")\n",
              "    @field_validator(\"vk_credentials_file\", mode=\"before\")\n    @classmethod\n    def normalize_empty_optional_path(cls, value: object) -> object:\n        return None if isinstance(value, str) and not value.strip() else value\n\n    @field_validator(\"worker_role\", \"scheduler_role\", mode=\"before\")\n",
          )
          replace_once(
              "backend/app/core/config.py",
              "        if self.worker_role not in {\"ai\", \"ai_control\"}:\n            return\n        self._validate_ai_publication_capabilities(\"AI worker\")\n\n    def _validate_ai_publication_capabilities",
              "        if self.worker_role == \"publication\":\n            self._validate_publication_execution_capabilities()\n            return\n        if self.worker_role not in {\"ai\", \"ai_control\"}:\n            return\n        self._validate_ai_publication_capabilities(\"AI worker\")\n\n    def _validate_publication_execution_capabilities(self) -> None:\n        errors: list[str] = []\n        if self.telegram_publishing_enabled:\n            if not self.telegram_bot_token:\n                errors.append(\"TELEGRAM_BOT_TOKEN\")\n            if not self.telegram_target_chat_id:\n                errors.append(\"TELEGRAM_TARGET_CHAT_ID\")\n        if self.vk_publishing_enabled:\n            if self.vk_owner_id is None or self.vk_owner_id >= 0:\n                errors.append(\"VK_OWNER_ID\")\n            if not self.vk_credentials_file:\n                errors.append(\"VK_CREDENTIALS_FILE\")\n            elif not Path(self.vk_credentials_file).is_file():\n                errors.append(\"VK_CREDENTIALS_FILE\")\n            if self.vk_access_token:\n                errors.append(\"VK_ACCESS_TOKEN_MUST_BE_EMPTY\")\n        if errors:\n            raise RuntimeError(\n                \"Publication worker configuration is invalid; fix: \"\n                + \", \".join(sorted(set(errors)))\n            )\n\n    def _validate_ai_publication_capabilities",
          )
          replace_once(
              "backend/app/core/config.py",
              "            \"VK_ACCESS_TOKEN\": bool(self.vk_access_token),\n            \"VK_OWNER_ID\": self.vk_owner_id is not None,\n",
              "            \"VK_ACCESS_TOKEN\": bool(self.vk_access_token),\n            \"VK_CREDENTIALS_FILE\": bool(self.vk_credentials_file),\n            \"VK_OWNER_ID\": self.vk_owner_id is not None,\n",
          )
          replace_once(
              "backend/app/core/config.py",
              "            \"VK_REQUEST_TIMEOUT_SECONDS\": self.vk_request_timeout_seconds,\n",
              "            \"VK_REQUEST_TIMEOUT_SECONDS\": self.vk_request_timeout_seconds,\n            \"VK_REFRESH_SKEW_SECONDS\": self.vk_refresh_skew_seconds,\n",
          )
          replace_once(
              "backend/app/core/config.py",
              "        if numeric_errors:\n            raise RuntimeError(\n",
              "        token_endpoint = urlparse(self.vk_id_token_endpoint)\n        if (\n            token_endpoint.scheme != \"https\"\n            or token_endpoint.hostname not in {\"id.vk.ru\", \"id.vk.com\"}\n        ):\n            numeric_errors.append(\"VK_ID_TOKEN_ENDPOINT\")\n        if numeric_errors:\n            raise RuntimeError(\n",
          )
          replace_once(
              "backend/app/core/config.py",
              "        if self.vk_publishing_enabled:\n            if not self.vk_access_token:\n                errors.append(\"VK_ACCESS_TOKEN\")\n            if self.vk_owner_id is None:\n                errors.append(\"VK_OWNER_ID\")\n",
              "        if self.vk_publishing_enabled:\n            if self.vk_owner_id is None or self.vk_owner_id >= 0:\n                errors.append(\"VK_OWNER_ID\")\n",
          )

          replace_once(
              "docker-compose.yml",
              "      VK_METRICS_ACCESS_TOKEN: \"\"\n      VK_METRICS_OWNER_ID: \"\"\n",
              "      VK_METRICS_ACCESS_TOKEN: \"\"\n      VK_METRICS_OWNER_ID: \"\"\n      VK_ACCESS_TOKEN: \"\"\n      VK_CREDENTIALS_FILE: \"\"\n",
          )
          replace_once(
              "docker-compose.yml",
              "  publication_worker:\n    <<: *worker\n    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=publication\n    profiles: [publishing]\n    environment:\n      <<: *no-metrics-environment\n      WORKER_ROLE: publication\n      SCHEDULER_ROLE: \"\"\n      OPENAI_API_KEY: \"\"\n",
              "  publication_worker:\n    <<: *worker\n    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=publication\n    profiles: [publishing]\n    volumes:\n      - ${VK_PUBLISHING_STATE_DIR:-./.runtime-secrets/vk}:/run/iteam-vk\n    environment:\n      <<: *no-metrics-environment\n      WORKER_ROLE: publication\n      SCHEDULER_ROLE: \"\"\n      OPENAI_API_KEY: \"\"\n      VK_CREDENTIALS_FILE: /run/iteam-vk/credentials.json\n",
          )
          replace_once(
              "docker-compose.yml",
              "      VK_ACCESS_TOKEN: \"\"\n      VK_OWNER_ID: \"\"\n      SCHEDULER_ROLE: \"\"\n",
              "      VK_ACCESS_TOKEN: \"\"\n      VK_CREDENTIALS_FILE: \"\"\n      VK_OWNER_ID: \"\"\n      SCHEDULER_ROLE: \"\"\n",
          )

          replace_once(
              ".env.example",
              "VK_ACCESS_TOKEN=\nVK_OWNER_ID=\nVK_API_VERSION=5.199\nVK_REQUEST_TIMEOUT_SECONDS=30\n",
              "# Static VK_ACCESS_TOKEN is intentionally unsupported for automatic production use.\nVK_ACCESS_TOKEN=\nVK_CREDENTIALS_FILE=\nVK_PUBLISHING_STATE_DIR=./.runtime-secrets/vk\nVK_OWNER_ID=\nVK_API_VERSION=5.199\nVK_REQUEST_TIMEOUT_SECONDS=30\nVK_ID_TOKEN_ENDPOINT=https://id.vk.ru/oauth2/auth\nVK_REFRESH_SKEW_SECONDS=120\n",
          )
          gitignore = Path(".gitignore")
          text = gitignore.read_text()
          if ".runtime-secrets/" not in text:
              gitignore.write_text(text.rstrip() + "\n.runtime-secrets/\n")
          PY
      - name: Validate patched files
        run: |
          python -m py_compile scripts/vk_user_token_preflight.py backend/app/integrations/vk_credentials.py
          python - <<'PY'
          from pathlib import Path
          text = Path("docker-compose.yml").read_text()
          assert text.count("/run/iteam-vk/credentials.json") == 1
          assert ".runtime-secrets/" in Path(".gitignore").read_text()
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/apply-vk-refresh-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Isolate refreshable VK publishing credentials"
          git push origin HEAD:fix/vk-refreshable-publishing
