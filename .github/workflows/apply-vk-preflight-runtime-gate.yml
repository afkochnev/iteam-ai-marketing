name: Apply VK preflight runtime safety gate

on:
  push:
    branches:
      - fix/vk-refreshable-publishing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vk-refreshable-publishing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply runtime gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/vk_user_token_preflight.py")
          text = path.read_text()
          marker = "\ndef main() -> int:\n"
          functions = r'''
          def dotenv_values(path: Path) -> dict[str, str]:
              try:
                  lines = path.read_text(encoding="utf-8").splitlines()
              except OSError as exc:
                  raise PreflightError("Рабочий .env не найден или недоступен.") from exc
              values: dict[str, str] = {}
              for raw in lines:
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  values[key.strip()] = value.strip().strip("'\"")
              return values


          def validate_local_runtime(repository_dir: Path, *, group_id: int) -> None:
              if not repository_dir.is_dir() or not (repository_dir / "docker-compose.yml").is_file():
                  raise PreflightError("Не найден рабочий каталог iTeam AI Marketing.")
              values = dotenv_values(repository_dir / ".env")
              enabled = values.get("VK_PUBLISHING_ENABLED", "false").strip().lower()
              if enabled not in {"false", "0", "no", "off"}:
                  raise PreflightError(
                      "VK_PUBLISHING_ENABLED должен оставаться false во время preflight."
                  )
              if values.get("VK_ACCESS_TOKEN", "").strip():
                  raise PreflightError(
                      "Удалите статический VK_ACCESS_TOKEN из .env до preflight."
                  )
              configured_owner = values.get("VK_OWNER_ID", "").strip()
              if configured_owner:
                  try:
                      owner_id = int(configured_owner)
                  except ValueError as exc:
                      raise PreflightError("VK_OWNER_ID в .env имеет неверный формат.") from exc
                  if owner_id != -group_id:
                      raise PreflightError(
                          "VK_OWNER_ID в .env не совпадает с целевым сообществом."
                      )
          '''
          functions = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in functions.splitlines()
          )
          if text.count(marker) != 1:
              raise SystemExit("main marker mismatch")
          text = text.replace(marker, f"\n{functions}{marker}", 1)

          main_start = text.index("def main() -> int:")
          block_start = text.index("    try:\n", main_start)
          block_end = text.index("\n        code_verifier =", block_start)
          new_block = '''    try:
              group_id = args.group_id
              if group_id <= 0:
                  raise PreflightError("Group ID должен быть положительным.")
              repository_dir = args.repository_dir.resolve()
              validate_local_runtime(repository_dir, group_id=group_id)

              client_id = args.client_id or int(input("VK ID application ID: ").strip())
              redirect_uri = (
                  args.redirect_uri
                  or input("Точный redirect URI из кабинета VK ID: ").strip()
              )
              if client_id <= 0 or not redirect_uri:
                  raise PreflightError("Application ID или redirect URI не заданы.")
          '''
          new_block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_block.splitlines()
          )
          text = text[:block_start] + new_block + text[block_end:]
          expected = "provision_docker_volume(args.repository_dir.resolve(), credentials)"
          if text.count(expected) != 1:
              raise SystemExit("provision call marker mismatch")
          text = text.replace(
              expected,
              "provision_docker_volume(repository_dir, credentials)",
              1,
          )
          path.write_text(text)
          PY
      - name: Add runtime-gate tests
        run: |
          cat >> backend/app/tests/test_vk_preflight_script.py <<'PY'


          def test_local_runtime_gate_requires_vk_disabled_and_no_static_token(
              tmp_path: Path,
          ) -> None:
              script = load_script()
              (tmp_path / "docker-compose.yml").write_text("services: {}\n")
              env = tmp_path / ".env"

              env.write_text(
                  "VK_PUBLISHING_ENABLED=true\n"
                  "VK_ACCESS_TOKEN=\n"
                  "VK_OWNER_ID=-150574411\n"
              )
              with pytest.raises(script.PreflightError, match="должен оставаться false"):
                  script.validate_local_runtime(tmp_path, group_id=150574411)

              env.write_text(
                  "VK_PUBLISHING_ENABLED=false\n"
                  "VK_ACCESS_TOKEN=must-not-be-used\n"
                  "VK_OWNER_ID=-150574411\n"
              )
              with pytest.raises(script.PreflightError, match="статический VK_ACCESS_TOKEN"):
                  script.validate_local_runtime(tmp_path, group_id=150574411)


          def test_local_runtime_gate_binds_exact_owner(tmp_path: Path) -> None:
              script = load_script()
              (tmp_path / "docker-compose.yml").write_text("services: {}\n")
              env = tmp_path / ".env"
              env.write_text(
                  "VK_PUBLISHING_ENABLED=false\n"
                  "VK_ACCESS_TOKEN=\n"
                  "VK_OWNER_ID=-999\n"
              )

              with pytest.raises(script.PreflightError, match="не совпадает"):
                  script.validate_local_runtime(tmp_path, group_id=150574411)

              env.write_text(
                  "VK_PUBLISHING_ENABLED=false\n"
                  "VK_ACCESS_TOKEN=\n"
                  "VK_OWNER_ID=-150574411\n"
              )
              script.validate_local_runtime(tmp_path, group_id=150574411)
          PY
      - name: Format and validate
        run: |
          pip install ruff==0.12.10
          ruff check --fix scripts/vk_user_token_preflight.py backend/app/tests/test_vk_preflight_script.py
          ruff format scripts/vk_user_token_preflight.py backend/app/tests/test_vk_preflight_script.py
          python -m py_compile scripts/vk_user_token_preflight.py
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/apply-vk-preflight-runtime-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fail closed before VK authorization in unsafe runtime"
          git push origin HEAD:fix/vk-refreshable-publishing
