name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: iteam_test
          POSTGRES_USER: iteam
          POSTGRES_PASSWORD: iteam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iteam -d iteam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://iteam:iteam@localhost:5432/iteam_test
      TEST_DATABASE_URL: postgresql+asyncpg://iteam:iteam@localhost:5432/iteam_test
      REDIS_URL: redis://localhost:6379/15
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: test-only-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: test-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      # Production modules are checked strictly; pytest remains the test-code gate.
      - run: mypy app --exclude "app/tests"
      - run: alembic upgrade head
      - run: alembic check
      - name: Campaign Studio against real WordPress
        run: bash ../scripts/acceptance/studio_wordpress.sh
      - run: pytest
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  runtime-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Candidate admission controller contracts
        run: python3 -m unittest discover -s scripts/tests -p test_runtime_admission_drill.py -v
      - name: Actual checkout candidate passive admission and post-write containment
        run: python3 scripts/runtime_admission_drill.py --output runtime-admission-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-admission-candidate-proof
          path: runtime-admission-proof.json
          if-no-files-found: error

  migration-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Signed activation rehearsal contracts
        run: python3 -m unittest discover -s scripts/tests -p test_migration_activation_drill.py -v
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4
      - name: Signed migration, passive admission, activation and committed-write containment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/migration_activation_drill.py \
            --request scripts/fixtures/migration-activation-0028-to-0030.json \
            --output migration-activation-drill-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-activation-drill-proof
          path: migration-activation-drill-proof.json
          if-no-files-found: error

  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: >-
          python3 -m py_compile scripts/release_ops.py scripts/release_backup.py
          scripts/release_drill.py scripts/migration_release_approval.py
          scripts/migration_rehearsal_proof.py scripts/migration_apply_state.py
          scripts/migration_apply_backup.py scripts/migration_writer_barrier.py
          scripts/migration_apply_runtime.py scripts/migration_release_apply.py
          scripts/migration_apply_drill.py scripts/migration_operation_inspect.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4
      - name: Isolated schema migration 0028 to 0030 with published images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/migration_release_drill.py \
            --request scripts/fixtures/migration-0028-to-0030.json \
            --output migration-drill-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-drill-proof
          path: migration-drill-proof.json
          if-no-files-found: error
      # Exact successful main rehearsal from PR75. Refresh deliberately when
      # the evidence expires; this only prepares a review, never an approval.
      - name: Verify migration approval preparation against trusted main proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/migration_release_approval.py prepare \
            --rehearsal-run 45010986161 \
            --rehearsal-artifact 14749762846 \
            --proof-sha256 sha256:f32997ae0e2cdc5cc0e351c2065b5c1d6689b63a286a0cfc919c67adf964b755 \
            --expected-source-release f0913e0029e25da58ea95504fd07b0989811dbb9 \
            --expected-source-schema 20261009_0028 \
            --target-build-run 44954363133 \
            --output migration-approval-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-approval-check
          path: migration-approval-check.json
          if-no-files-found: error
      - name: Isolated pre-activation migration apply and guarded recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/migration_apply_drill.py \
            --request scripts/fixtures/migration-0028-to-0030.json \
            --output migration-apply-drill-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-apply-drill-proof
          path: migration-apply-drill-proof.json
          if-no-files-found: error
      # Keep this schema-0028 drill on the proven historical releases as main advances.
      - name: Isolated upgrade, rollback and failure recovery on schema 0028
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_drill.py \
            --from-build-run 44934401980 \
            --to-build-run 44937076752 \
            --output release-drill-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-drill-proof
          path: release-drill-proof.json
          if-no-files-found: error

