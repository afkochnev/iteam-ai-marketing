name: Fix VK refresh request typing

on:
  push:
    branches:
      - fix/vk-refreshable-publishing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vk-refreshable-publishing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact typing fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/integrations/vk_credentials.py")
          text = path.read_text()
          old = "        params = {\n            \"grant_type\": \"refresh_token\",\n"
          new = "        params: dict[str, str | int] = {\n            \"grant_type\": \"refresh_token\",\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one params block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          pip install ruff==0.12.10
          ruff check backend/app/integrations/vk_credentials.py
          ruff format --check backend/app/integrations/vk_credentials.py
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/fix-vk-refresh-mypy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Type VK refresh request parameters"
          git push origin HEAD:fix/vk-refreshable-publishing
