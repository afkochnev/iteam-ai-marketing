name: Approve release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Release images run ID to approve (also used for rollback)
        required: true
        type: string
      expected_current_release_sha:
        description: Exact current production BUILD_SHA; a different source blocks apply
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: production-release-approval
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify release for human review
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run_id }}
          EXPECTED_SOURCE: ${{ inputs.expected_current_release_sha }}
        run: |
          python3 scripts/release_ops.py prepare --build-run "$BUILD_RUN" --output release.json
          python3 - <<'PYCODE'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from release_ops import accepted
          expected = os.environ['EXPECTED_SOURCE']
          accepted(expected)
          path = Path('release.json')
          path.write_text(json.dumps({'expected_source_release': expected, 'release': json.loads(path.read_text())}, sort_keys=True, indent=2) + '\n')
          PYCODE
          cat release.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-for-review
          path: release.json
          if-no-files-found: error
  approve:
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-for-review
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4
      - name: Sign the exact reviewed manifest (no production connection)
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path('release.json')
          reviewed = json.loads(path.read_text())
          path.write_text(json.dumps({
              'approval_run_id': int(os.environ['GITHUB_RUN_ID']),
              'approval_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'approval_workflow_sha': os.environ['GITHUB_SHA'],
              'expected_source_release': reviewed['expected_source_release'],
              'release': reviewed['release'],
          }, sort_keys=True, indent=2) + '\n')
          PYCODE
          cosign sign-blob --yes --bundle release.sigstore.json release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-release
          path: |
            release.json
            release.sigstore.json
          if-no-files-found: error
