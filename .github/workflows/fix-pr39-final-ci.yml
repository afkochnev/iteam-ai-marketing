name: Fix final PR39 CI findings

on:
  push:
    branches:
      - fix/overdue-plan-content-decisions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/overdue-plan-content-decisions
          fetch-depth: 0

      - name: Apply exact fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}; found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "backend/app/services/publication_service.py",
              '''    async def _active_or_published_for_plan_content(
        self,
        item: ContentItem,
        plan_item: PublicationPlanItem,
    ) -> Publication | None:
        return await self.session.scalar(
            select(Publication)
            .where(
                Publication.content_item_id == item.id,
                Publication.channel == plan_item.channel,
                Publication.status.in_((*ACTIVE_PUBLICATION_STATUSES, PublicationStatus.PUBLISHED)),
            )
            .order_by(Publication.created_at.desc())
            .with_for_update()
        )
''',
              '''    async def _active_or_published_for_plan_content(
        self,
        item: ContentItem,
        plan_item: PublicationPlanItem,
    ) -> Publication | None:
        publication: Publication | None = await self.session.scalar(
            select(Publication)
            .where(
                Publication.content_item_id == item.id,
                Publication.channel == plan_item.channel,
                Publication.status.in_((*ACTIVE_PUBLICATION_STATUSES, PublicationStatus.PUBLISHED)),
            )
            .order_by(Publication.created_at.desc())
            .with_for_update()
        )
        return publication
''',
          )

          replace_once(
              "frontend/tests/publications.test.tsx",
              '    expect(within(section).getByText("Просроченный плановый пост")).toBeInTheDocument();\n',
              '    expect(await within(section).findByText("Просроченный плановый пост")).toBeInTheDocument();\n',
          )
          replace_once(
              "frontend/tests/publications.test.tsx",
              '    fireEvent.click(within(section).getByRole("button", { name: "Отменить слот" }));\n',
              '    fireEvent.click(await within(section).findByRole("button", { name: "Отменить слот" }));\n',
          )
          PY
          rm -f .github/workflows/fix-pr39-final-ci.yml

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes produced" >&2; exit 1; }
          git commit -m "Fix final PR39 CI findings"
          git push origin HEAD:fix/overdue-plan-content-decisions

# Activation commit: workflow was already present before this push.
