name: Fix PR40 backend test formatting

"on":
  push:
    branches:
      - "fix/publication-workspace-followups"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/publication-workspace-followups
          fetch-depth: 0
      - name: Format exact test file
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/tests/test_content_read_models.py")
          text = path.read_text()
          old = '    campaign = Campaign(name="Archived read campaign", goal="Operational history", created_by=user.id)'
          new = '''    campaign = Campaign(
        name="Archived read campaign",
        goal="Operational history",
        created_by=user.id,
    )'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one long line, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/fix-pr40-backend-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format PR40 archived content regression test"
          git push origin HEAD:fix/publication-workspace-followups
