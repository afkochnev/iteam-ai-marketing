name: Run PR39 staged source transformation

on:
  push:
    branches:
      - fix/overdue-plan-content-decisions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/overdue-plan-content-decisions
          fetch-depth: 0

      - name: Extract and apply staged transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          workflow = Path('.github/workflows/apply-pr39.yml').read_text(encoding='utf-8')
          start_marker = "<<'B64'\n"
          end_marker = "\nB64\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          payload = ''.join(workflow[start:end].split())
          script = gzip.decompress(base64.b64decode(payload))
          target = Path('scripts/apply_pr39.py')
          target.write_bytes(script)
          PY
          python scripts/apply_pr39.py
          rm -f scripts/apply_pr39.py
          rm -f .github/workflows/apply-pr39.yml
          rm -f .github/workflows/apply-pr39-runner.yml

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No source changes were produced" >&2; exit 1; }
          git commit -m "Handle overdue plan slots before Publication creation"
          git push origin HEAD:fix/overdue-plan-content-decisions
