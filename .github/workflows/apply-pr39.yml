name: Apply PR39 overdue plan decision patch

on:
  push:
    branches:
      - fix/overdue-plan-content-decisions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/overdue-plan-content-decisions
          fetch-depth: 0

      - name: Apply asserted source transformations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > scripts/apply_pr39.py.gz.b64 <<'B64'

B64
          base64 --decode scripts/apply_pr39.py.gz.b64 | gzip -d > scripts/apply_pr39.py
          python scripts/apply_pr39.py
          rm -f scripts/apply_pr39.py scripts/apply_pr39.py.gz.b64 .github/workflows/apply-pr39.yml

      - name: Commit applied source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No source changes were produced" >&2; exit 1; }
          git commit -m "Handle overdue plan slots before Publication creation"
          git push origin HEAD:fix/overdue-plan-content-decisions
