services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iteam}
      POSTGRES_USER: ${POSTGRES_USER:-iteam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iteam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai_worker:
    build:
      context: ./backend
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    command: celery -A app.workers.celery_app:celery_app worker --queues=ai --loglevel=INFO
    env_file: .env
    environment:
      CELERY_ROLE: ai_worker
      TELEGRAM_PUBLISHING_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_TARGET_CHAT_ID: ""
      VK_PUBLISHING_ENABLED: "false"
      VK_ACCESS_TOKEN: ""
      VK_OWNER_ID: ""
    restart: unless-stopped
    stop_grace_period: 210s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai_scheduler:
    build:
      context: ./backend
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-ai
    env_file: .env
    environment:
      CELERY_ROLE: ai_scheduler
      CELERY_BEAT_ROLE: ai
      TELEGRAM_PUBLISHING_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_TARGET_CHAT_ID: ""
      VK_PUBLISHING_ENABLED: "false"
      VK_ACCESS_TOKEN: ""
      VK_OWNER_ID: ""
      OPENAI_API_KEY: ""
      OPENAI_VECTOR_STORE_ID: ""
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  publication_worker:
    profiles: [publishing]
    build:
      context: ./backend
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    command: celery -A app.workers.celery_app:celery_app worker --queues=publication --loglevel=INFO
    env_file: .env
    environment:
      CELERY_ROLE: publication_worker
      OPENAI_API_KEY: ""
      OPENAI_VECTOR_STORE_ID: ""
    restart: unless-stopped
    stop_grace_period: 210s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  publication_control_worker:
    profiles: [publishing]
    build:
      context: ./backend
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    command: celery -A app.workers.celery_app:celery_app worker --queues=publication_control --loglevel=INFO
    env_file: .env
    environment:
      CELERY_ROLE: publication_control_worker
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_TARGET_CHAT_ID: ""
      VK_ACCESS_TOKEN: ""
      VK_OWNER_ID: ""
      OPENAI_API_KEY: ""
      OPENAI_VECTOR_STORE_ID: ""
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  publication_scheduler:
    profiles: [publishing]
    build:
      context: ./backend
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-publication
    env_file: .env
    environment:
      CELERY_ROLE: publication_scheduler
      CELERY_BEAT_ROLE: publication
      TELEGRAM_PUBLISHING_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_TARGET_CHAT_ID: ""
      VK_PUBLISHING_ENABLED: "false"
      VK_ACCESS_TOKEN: ""
      VK_OWNER_ID: ""
      OPENAI_API_KEY: ""
      OPENAI_VECTOR_STORE_ID: ""
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  metrics_worker:
    profiles: [publishing]
    build:
      context: ./backend
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    command: celery -A app.workers.celery_app:celery_app worker --queues=metrics --loglevel=INFO
    env_file: .env
    environment:
      CELERY_ROLE: metrics_worker
      OPENAI_API_KEY: ""
      OPENAI_VECTOR_STORE_ID: ""
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
