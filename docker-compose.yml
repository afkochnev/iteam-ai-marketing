x-worker: &worker
  build:
    context: ./backend
    args:
      BUILD_SHA: ${BUILD_SHA:-unknown}
  env_file: .env
  restart: unless-stopped
  stop_grace_period: 210s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iteam}
      POSTGRES_USER: ${POSTGRES_USER:-iteam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iteam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    env_file: .env
    environment: &no-metrics-environment
      TELEGRAM_METRICS_ENABLED: "false"
      TELEGRAM_METRICS_API_ID: ""
      TELEGRAM_METRICS_API_HASH: ""
      TELEGRAM_METRICS_SESSION: ""
      TELEGRAM_METRICS_PEER: ""
      TELEGRAM_METRICS_CHAT_ID: ""
      VK_METRICS_ENABLED: "false"
      VK_METRICS_ACCESS_TOKEN: ""
      VK_METRICS_OWNER_ID: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai_worker:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=ai
    restart: unless-stopped
    environment: &ai-worker-environment
      <<: *no-metrics-environment
      WORKER_ROLE: ai
      SCHEDULER_ROLE: ""
      TELEGRAM_PUBLISHING_ENABLED: "false"
      VK_PUBLISHING_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_TARGET_CHAT_ID: ""
      VK_ACCESS_TOKEN: ""
      VK_OWNER_ID: ""

  ai_control_worker:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=ai_control
    restart: unless-stopped
    environment:
      <<: *ai-worker-environment
      WORKER_ROLE: ai_control

  ai_scheduler:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/ai-celerybeat-schedule
    restart: unless-stopped
    environment:
      <<: *ai-worker-environment
      WORKER_ROLE: ""
      SCHEDULER_ROLE: ai

  publication_scheduler:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/publication-celerybeat-schedule
    profiles: [publishing]
    environment:
      <<: *no-metrics-environment
      WORKER_ROLE: ""
      SCHEDULER_ROLE: publication
      OPENAI_API_KEY: ""

  publication_worker:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=publication
    profiles: [publishing]
    environment:
      <<: *no-metrics-environment
      WORKER_ROLE: publication
      SCHEDULER_ROLE: ""
      OPENAI_API_KEY: ""

  publication_control_worker:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=publication_control
    profiles: [publishing]
    environment:
      <<: *no-metrics-environment
      WORKER_ROLE: publication_control
      SCHEDULER_ROLE: ""
      OPENAI_API_KEY: ""

  metrics_worker:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=metrics
    profiles: [publishing]
    environment:
      WORKER_ROLE: metrics
      TELEGRAM_PUBLISHING_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_TARGET_CHAT_ID: ""
      VK_PUBLISHING_ENABLED: "false"
      VK_ACCESS_TOKEN: ""
      VK_OWNER_ID: ""
      SCHEDULER_ROLE: ""
      OPENAI_API_KEY: ""

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
