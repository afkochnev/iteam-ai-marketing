x-worker: &worker
  build:
    context: ./backend
    args:
      BUILD_SHA: ${BUILD_SHA:-unknown}
  env_file: .env
  stop_grace_period: 210s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iteam}
      POSTGRES_USER: ${POSTGRES_USER:-iteam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iteam}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai_worker:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=ai
    restart: unless-stopped
    environment: &ai-worker-environment
      WORKER_ROLE: ai
      TELEGRAM_PUBLISHING_ENABLED: "false"
      VK_PUBLISHING_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_TARGET_CHAT_ID: ""
      VK_ACCESS_TOKEN: ""
      VK_OWNER_ID: ""

  ai_control_worker:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=ai_control
    restart: unless-stopped
    environment:
      <<: *ai-worker-environment
      WORKER_ROLE: ai_control

  publication_worker:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=publication
    profiles: [publishing]
    environment:
      WORKER_ROLE: publication
      OPENAI_API_KEY: ""

  publication_control_worker:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=publication_control
    profiles: [publishing]
    environment:
      WORKER_ROLE: publication_control
      OPENAI_API_KEY: ""

  metrics_worker:
    <<: *worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=metrics
    profiles: [publishing]
    environment:
      WORKER_ROLE: metrics
      OPENAI_API_KEY: ""

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
